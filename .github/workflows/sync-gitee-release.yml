name: Sync Gitee Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      GITEE_ACCESS_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to mirror
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gitee-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publishing dependencies
        run: python -m pip install 'requests>=2.32,<3'
      - name: Mirror release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN || secrets.GITEE_ACCESSS_TOKEN }}
        run: python scripts/sync_gitee_tag.py --tag "$RELEASE_TAG"
      - name: Download published assets
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python -u scripts/sync_gitee_release.py --tag "$RELEASE_TAG" --directory release --download-only
      - name: Sync and verify Gitee assets
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN || secrets.GITEE_ACCESSS_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          PYTHONUNBUFFERED: '1'
        run: |
          curl --version
          python scripts/sync_gitee_release.py --tag "$RELEASE_TAG" --directory release
